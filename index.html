
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive To-Do List</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #eef2ff;
      margin: 0;
      padding: 30px 15px;
      color: #1f2937;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 8px 25px #00000015;
    }

    h1 {
      text-align: center;
      color: #4f46e5;
    }

    .subtitle {
      text-align: center;
      color: #667085;
      margin-bottom: 25px;
    }

    form {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      padding: 10px 13px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .add-btn {
      background: #4f46e5;
      color: white;
    }

    .filters {
      display: flex;
      gap: 7px;
      margin: 20px 0 10px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: #f2f4f7;
      color: #344054;
    }

    .filter-btn.active {
      background: #4f46e5;
      color: white;
    }

    .task-info {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      color: #667085;
      font-size: 14px;
      margin: 15px 0;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 0;
      border-bottom: 1px solid #eee;
    }

    .task-text {
      flex: 1;
      overflow-wrap: anywhere;
    }

    li.completed .task-text {
      text-decoration: line-through;
      color: #98a2b3;
    }

    .delete-btn {
      background: #fee2e2;
      color: #b91c1c;
    }

    .empty {
      text-align: center;
      padding: 25px 5px;
      color: #667085;
    }

    .bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
      border-top: 1px solid #eee;
      padding-top: 15px;
    }

    .clear-btn {
      background: #fff1f2;
      color: #be123c;
    }

    .note {
      text-align: center;
      font-size: 12px;
      color: #667085;
      margin-top: 20px;
    }

    @media (max-width: 420px) {
      .container {
        padding: 16px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>My To-Do List ✨</h1>
    <p class="subtitle">Plan your day, one task at a time.</p>

    <form id="taskForm">
      <input
        type="text"
        id="taskInput"
        placeholder="Enter a new task..."
        maxlength="180"
        required
      >
      <button class="add-btn" type="submit">+ Add</button>
    </form>

    <div class="filters">
      <button class="filter-btn active" data-filter="all" type="button">All</button>
      <button class="filter-btn" data-filter="active" type="button">Active</button>
      <button class="filter-btn" data-filter="done" type="button">Done</button>
    </div>

    <div class="task-info">
      <span id="remaining">0 tasks left</span>
      <span id="total">0 total tasks</span>
    </div>

    <ul id="taskList"></ul>
    <div class="empty" id="emptyMessage">
      No tasks yet. Add your first task!
    </div>

    <div class="bottom">
      <span>Stay organized!</span>
      <button class="clear-btn" id="clearCompleted" type="button">
        Clear Completed
      </button>
    </div>

    <p class="note">
      Tasks are saved in your browser using LocalStorage.
    </p>
  </div>

  <script>
    const STORAGE_KEY = "interactiveTodoTasks";
    const taskForm = document.getElementById("taskForm");
    const taskInput = document.getElementById("taskInput");
    const taskList = document.getElementById("taskList");
    const remaining = document.getElementById("remaining");
    const total = document.getElementById("total");
    const emptyMessage = document.getElementById("emptyMessage");
    const clearCompleted = document.getElementById("clearCompleted");
    const filterButtons = document.querySelectorAll("[data-filter]");

    let currentFilter = "all";
    let tasks = loadTasks();

    // Load tasks previously saved in LocalStorage.
    function loadTasks() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        const data = saved ? JSON.parse(saved) : [];
        return Array.isArray(data) ? data : [];
      } catch (error) {
        return [];
      }
    }

    // Save the updated task list in LocalStorage.
    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    // Add a new task.
    taskForm.addEventListener("submit", function(event) {
      event.preventDefault();

      const text = taskInput.value.trim();
      if (!text) return;

      tasks.unshift({
        id: Date.now().toString() + Math.random().toString(16).slice(2),
        text: text,
        completed: false
      });

      saveTasks();
      taskInput.value = "";
      renderTasks();
      taskInput.focus();
    });

    // Return tasks matching the selected filter.
    function getVisibleTasks() {
      if (currentFilter === "active") {
        return tasks.filter(task => !task.completed);
      }

      if (currentFilter === "done") {
        return tasks.filter(task => task.completed);
      }

      return tasks;
    }

    // Display tasks on the page.
    function renderTasks() {
      taskList.replaceChildren();

      const visible = getVisibleTasks();

      visible.forEach(function(task) {
        const li = document.createElement("li");

        if (task.completed) {
          li.classList.add("completed");
        }

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.completed;
        checkbox.setAttribute("aria-label", "Mark task complete");

        checkbox.addEventListener("change", function() {
          task.completed = checkbox.checked;
          saveTasks();
          renderTasks();
        });

        const text = document.createElement("span");
        text.className = "task-text";
        text.textContent = task.text;

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "delete-btn";
        deleteButton.textContent = "Delete";

        deleteButton.addEventListener("click", function() {
          tasks = tasks.filter(item => item.id !== task.id);
          saveTasks();
          renderTasks();
        });

        li.append(checkbox, text, deleteButton);
        taskList.appendChild(li);
      });

      const left = tasks.filter(task => !task.completed).length;

      remaining.textContent =
        left + (left === 1 ? " task left" : " tasks left");

      total.textContent =
        tasks.length + (tasks.length === 1 ? " total task" : " total tasks");

      emptyMessage.hidden = visible.length > 0;
      emptyMessage.textContent = tasks.length === 0
        ? "No tasks yet. Add your first task!"
        : "No tasks in this filter.";

      clearCompleted.disabled = !tasks.some(task => task.completed);
      clearCompleted.style.opacity = clearCompleted.disabled ? "0.5" : "1";

      filterButtons.forEach(function(button) {
        const selected = button.dataset.filter === currentFilter;
        button.classList.toggle("active", selected);
        button.setAttribute("aria-pressed", String(selected));
      });
    }

    // Change the task filter.
    filterButtons.forEach(function(button) {
      button.addEventListener("click", function() {
        currentFilter = button.dataset.filter;
        renderTasks();
      });
    });

    // Remove every completed task.
    clearCompleted.addEventListener("click", function() {
      tasks = tasks.filter(task => !task.completed);
      saveTasks();
      renderTasks();
    });

    // Show saved tasks when the page opens.
    renderTasks();
  </script>
</body>
</html>
